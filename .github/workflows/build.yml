name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# В репозитории нет gradle-wrapper.jar, поэтому Gradle ставит setup-gradle.
# Tamed Phantoms скачивается со страниц его GitHub Release.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build and test
        run: gradle build --stacktrace

      - name: Run game tests (NeoForge 1.21.1)
        run: gradle runGameTestServer --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: tamedphantomscolors-jars
          path: |
            build/libs/*.jar
            fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
