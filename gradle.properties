# ============================================================
# Настройки Gradle
# ============================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# ============================================================
# Parchment-маппинги
# https://parchmentmc.org/docs/getting-started
# ============================================================
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
# Minecraft / NeoForge
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[1,)

# ============================================================
# Kotlin for Forge — https://modrinth.com/mod/kotlin-for-forge
# Обязательно артефакт kotlinforforge-neoforge.
# ============================================================
kotlin_version=2.1.20
kff_version=5.8.0
kff_version_range=[5.8,)

# ============================================================
# Tamed Phantoms — родительский мод. Jar берётся со страниц GitHub Release:
# minecraft-1.21.1-neoforge и minecraft-1.21.1-fabric.
# ============================================================
tamedphantoms_version=1.0.11
tamedphantoms_version_range=[1.0.11,)

# Необязательные моды: страница в книге и настоящий свет.
patchouli_version=1.21.1-93-neoforge
patchouli_fabric_version=1.21.1-93-fabric
lambdynamiclights_version=4.8.11+1.21.1

# ============================================================
# Fabric 1.21.1
# ============================================================
fabric_loader_version=0.16.14
fabric_api_version=0.116.17+1.21.1
fabric_kotlin_version=1.13.2+kotlin.2.1.20
# Tamed Phantoms на Fabric требует Cloth Config.
cloth_config_version=15.0.140
cloth_config_modrinth_version=15.0.140+fabric
# Только для страниц релиза: экран настроек Tamed Phantoms на Fabric. Те же версии, что у родителя.
modmenu_version=11.0.4
placeholder_api_version=2.4.2+1.21

# ============================================================
# Метаданные мода
# ============================================================
mod_id=tamedphantomscolors
mod_name=Tamed Phantoms Colors
mod_license=MPL-2.0
mod_version=1.2.1
mod_group_id=com.tamedphantomscolors.mod
mod_authors=Tamed Phantoms contributors
mod_description=[Tamed Phantoms Colors](https://github.com/Nergan/tamedphantoms-colors-mod): dye tamed phantoms and their saddles, and make them glow.
